<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧌 Mind Goblins Combine</title>
<style>
  :root {
    --surface-1: #fcfcfb; --page: #f9f9f7;
    --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #898781;
    --gridline: #e1e0d9; --border: rgba(11,11,11,0.10);
    --accent: #4a3aa7; --accent-soft: #eeebfa; --accent-dark: #382c80;
    --good: #0ca30c; --good-soft: #e6f6e6;
    --warn: #fab219; --warn-soft: #fff6e0;
    --critical: #d03b3b;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      --surface-1: #1a1a19; --page: #0d0d0d;
      --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #898781;
      --gridline: #2c2c2a; --border: rgba(255,255,255,0.10);
      --accent: #9085e9; --accent-soft: #2a2350; --accent-dark: #b4abf0;
      --good: #0ca30c; --good-soft: #10331a;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background: var(--page); color: var(--text-primary); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { padding-bottom: 60px; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 20px 16px 40px; }
  header.top { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px; padding:18px 16px; background: var(--accent); color:#fff; border-radius:0 0 18px 18px; margin-bottom:18px; }
  header.top h1 { margin:0; font-size:20px; display:flex; align-items:center; gap:8px; }
  header.top .sub { font-size:12px; opacity:.85; margin-top:2px; }
  .top-actions { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .btn { font:inherit; cursor:pointer; border:none; border-radius:10px; padding:8px 14px; font-size:13px; font-weight:600; background: var(--accent); color:#fff; transition: opacity .15s; }
  .btn:hover { opacity:.88; } .btn:disabled { opacity:.4; cursor:not-allowed; }
  .btn.secondary { background: var(--surface-1); color: var(--text-primary); border:1px solid var(--border); }
  .btn.ghost { background:transparent; color:#fff; border:1px solid rgba(255,255,255,0.5); }
  .btn.danger { background: var(--critical); color:#fff; }
  .btn.small { padding:5px 10px; font-size:12px; border-radius:8px; }
  nav.tabs { display:flex; gap:6px; margin-bottom:18px; border-bottom:1px solid var(--gridline); overflow-x:auto; }
  nav.tabs button { font:inherit; cursor:pointer; border:none; background:transparent; padding:10px 14px; font-size:14px; font-weight:600; color:var(--text-muted); border-bottom:3px solid transparent; white-space:nowrap; }
  nav.tabs button.active { color:var(--accent); border-bottom-color:var(--accent); }
  .card { background:var(--surface-1); border:1px solid var(--border); border-radius:14px; padding:18px; margin-bottom:16px; }
  .card h2 { margin:0 0 4px; font-size:16px; }
  .card h3 { margin:0 0 4px; font-size:14px; }
  .card .desc { color:var(--text-secondary); font-size:13px; margin:0 0 14px; }
  .badge { display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; padding:3px 8px; border-radius:999px; background:var(--accent-soft); color:var(--accent-dark); }
  .badge.good { background:var(--good-soft); color:var(--good); }
  .badge.warn { background:var(--warn-soft); color:#8a5a00; }
  .badge.muted { background:var(--gridline); color:var(--text-secondary); }
  .sync-status { font-size:11px; color:rgba(255,255,255,0.85); display:flex; align-items:center; gap:5px; }
  .dot { width:7px; height:7px; border-radius:50%; background:#7be07b; } .dot.off { background:#f2c96b; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:7px 6px; border-bottom:1px solid var(--gridline); }
  th { color:var(--text-muted); font-weight:600; font-size:10.5px; text-transform:uppercase; letter-spacing:.03em; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  td.ctr, th.ctr { text-align:center; }
  input[type=number], input[type=text], input[type=password], select, textarea {
    font:inherit; padding:6px 8px; border-radius:8px; border:1px solid var(--border);
    background: var(--surface-1); color:var(--text-primary); width:100%;
  }
  input[type=number] { text-align:right; }
  .hole-input { width:38px !important; padding:4px 2px !important; text-align:center !important; font-size:12px; }
  .event-tab-list { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
  .event-chip { padding:6px 12px; border-radius:999px; border:1px solid var(--border); background:var(--surface-1); font-size:12px; font-weight:600; cursor:pointer; color:var(--text-secondary); white-space:nowrap; }
  .event-chip.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,0.45); display:flex; align-items:center; justify-content:center; z-index:50; padding:16px; }
  .modal { background:var(--surface-1); border-radius:14px; padding:22px; max-width:420px; width:100%; max-height:85vh; overflow:auto; }
  .modal h3 { margin-top:0; } .modal .row { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
  .toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:var(--text-primary); color:var(--surface-1); padding:10px 16px; border-radius:10px; font-size:13px; z-index:60; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.show { opacity:.95; }
  .field { margin-bottom:12px; }
  .field label { display:block; font-size:12px; font-weight:600; color:var(--text-secondary); margin-bottom:4px; }
  .muted-note { font-size:12px; color:var(--text-muted); }
  .empty-state { text-align:center; padding:30px 10px; color:var(--text-muted); font-size:13px; }
  a.link { color:var(--accent); cursor:pointer; text-decoration:underline; font-size:12px; }
  .code-box { font-family:ui-monospace, monospace; background:var(--gridline); padding:6px 10px; border-radius:8px; font-size:12px; word-break:break-all; }
  hr.sep { border:none; border-top:1px solid var(--gridline); margin:16px 0; }
  .id-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap:8px; margin-top:10px; }
  .id-card { border:2px solid var(--border); border-radius:12px; padding:12px; text-align:center; cursor:pointer; background:var(--surface-1); font-weight:700; font-size:13px; }
  .id-card:hover { border-color:var(--accent); }
  .id-card .role-tag { display:block; font-size:10px; font-weight:600; color:var(--text-muted); margin-top:4px; text-transform:uppercase; }
  .std-table td, .std-table th { white-space:nowrap; vertical-align:middle; }
  .std-table th, .std-table td { padding:5px 4px; }
  .std-head { vertical-align:bottom; }
  .std-head-icon { font-size:15px; line-height:1.15; }
  .std-head-label { font-size:8.5px; font-weight:700; text-transform:uppercase; letter-spacing:.02em; color:var(--text-muted); white-space:nowrap; }
  .std-table .std-team-name { max-width:150px; white-space:normal; word-break:normal; overflow-wrap:break-word; line-height:1.2; font-size:12.5px; position:sticky; left:0; background:var(--surface-1); z-index:1; }
  .std-owner { font-size:9px; font-weight:400; color:var(--text-muted); white-space:normal; overflow-wrap:break-word; line-height:1.2; }
  .std-cell { text-align:center; }
  .std-pts { font-weight:800; font-size:13px; line-height:1.2; position:relative; display:inline-block; }
  .std-table .std-raw { font-size:9.5px; color:var(--text-muted); margin-top:1px; white-space:normal; overflow-wrap:break-word; line-height:1.25; max-width:56px; margin-left:auto; margin-right:auto; }
  .std-raw-detail { display:block; opacity:.85; }
  .std-badge { font-size:8px; position:absolute; top:-4px; right:-9px; line-height:1; }
  .std-table th:last-child, .std-table td:last-child { position:sticky; right:0; background:var(--surface-1); box-shadow:-2px 0 4px rgba(0,0,0,0.08); }
  @media (max-width: 900px) { .std-table th, .std-table td { padding:4px 3px; } .std-head-label { font-size:7.5px; } .std-table .std-raw { max-width:48px; } .std-table .std-team-name { max-width:110px; } }
  @media (max-width: 480px) {
    .std-table th, .std-table td { padding:7px 2px; }
    .std-table .std-team-name { font-size:11px; max-width:104px; }
    .std-owner { font-size:7.5px; }
    .std-head-icon { font-size:13px; }
    .std-head-label { font-size:6.5px; }
    .std-pts { font-size:12px; }
    .std-table .std-raw { font-size:8px; max-width:38px; }
    .std-raw-detail { display:none; }
    .std-badge { font-size:6.5px; top:-3px; right:-6px; }
  }
  .team-col-label { font-size:11px; }
  .locked-box { text-align:center; padding:40px 16px; color:var(--text-muted); }
  .locked-box .lock-icon { font-size:36px; margin-bottom:10px; }
  .matchup-row { display:flex; align-items:center; gap:10px; padding:10px; border:1px solid var(--border); border-radius:10px; margin-bottom:8px; flex-wrap:wrap; }
  .matchup-row .side { flex:1; min-width:120px; font-weight:600; font-size:13px; }
  .matchup-row .side.winner { color: var(--good); }
  .team-roster-box { border:1px solid var(--border); border-radius:10px; padding:10px 12px; flex:1; min-width:150px; }
  .team-roster-box h4 { margin:0 0 6px; font-size:13px; }
  .team-roster-box ul { margin:0; padding-left:18px; font-size:12.5px; }
  .golf-team-card { border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:10px; }
  .golf-holes-row { display:flex; gap:4px; overflow-x:auto; padding:6px 0; }
  .golf-hole-cell { display:flex; flex-direction:column; align-items:center; gap:2px; flex-shrink:0; }
  .golf-hole-cell label { font-size:9px; color:var(--text-muted); }
  .quiz-q-block { border:1px solid var(--border); border-radius:10px; padding:12px; margin-bottom:10px; }
  .blurred { filter: blur(6px); pointer-events:none; user-select:none; }
  .blur-wrap { position:relative; }
  .blur-overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
</style>
</head>

/* Backfill fields for state saved by an older version of this app (e.g. a live DB seeded before
   the Spectator role or the 15-question quiz existed), so older data keeps working without a reset. */
function migrateState(s){
  if (!s) return s;
  if (!s.spectator) s.spectator = { id: SPECTATOR_ID, name: "Spectator" };
  if (s.contributor && !s.contributor.logo) s.contributor.logo = CHUCK_LOGO;
  if (!s.quiz) s.quiz = defaultState().quiz;
  if (s.quiz && Array.isArray(s.quiz.questions)) {
    while (s.quiz.questions.length < QUIZ_QUESTION_COUNT) s.quiz.questions.push({ q:"", a:"" });
  }
  if (!s.overrides) s.overrides = {};
  if (s.teams) {
    const kase = s.teams.find(t => t.id === "t2");
    if (kase && !kase.coOwnerNames) kase.coOwnerNames = ["Flynn","Peb"];
    s.teams.forEach(t => {
      const def = TEAM_DEFS.find(d => d.id === t.id);
      if (!def) return;
      if (!t.ownerName) t.ownerName = def.ownerName || "";
      if (!t.logo) t.logo = def.logo || null;
    });
  }
  if (s.matchResults && s.matchResults.football) {
    const mr = s.matchResults.football;
    // migrate from the old pairwise round-robin shape ("1-2","1-3",...) to the new bracket shape
    if (mr["1-2"] !== undefined || mr["3-4"] !== undefined) {
      s.matchResults.football = { semiA: null, semiB: null, final: null, consolation: null };
    } else {

async function hashPin(identityId, pin) {
  const enc = new TextEncoder().encode("mgc-salt::" + identityId + "::" + pin);

/* ============================== EVENT ENGINE ============================== */

function parseTimeToSeconds(str){
  if (!str) return null;
  const m = String(str).trim().match(/^(\d+):(\d{1,2}(?:\.\d+)?)$/);
  if (!m) { const n = Number(str); return isNaN(n)?null:n; }
  return Number(m[1])*60 + Number(m[2]);
}
function formatSeconds(sec){
  if (sec == null || isNaN(sec)) return "—";
  const m = Math.floor(sec/60), s = sec - m*60;
  return m + ":" + (s<10?"0":"") + (Number.isInteger(s)?s:s.toFixed(1));

/* Fuzzy answer grading — tolerant of typos/misspellings, not just exact string match */
function normalizeAnswer(s){
  return String(s||"").trim().toLowerCase().replace(/[^\w\s]/g,"").replace(/\s+/g," ").trim();
}
function levenshtein(a,b){
  const m=a.length, n=b.length;
  if (m===0) return n; if (n===0) return m;
  let prev = Array.from({length:n+1}, (_,j)=>j);
  for (let i=1;i<=m;i++){
    const cur = [i];
    for (let j=1;j<=n;j++){
      cur[j] = a[i-1]===b[j-1] ? prev[j-1] : 1 + Math.min(prev[j-1], prev[j], cur[j-1]);
    }
    prev = cur;
  }
  return prev[n];
}
function answersMatch(submitted, key){
  const a = normalizeAnswer(submitted), k = normalizeAnswer(key);
  if (!k) return false; // no answer key entered for this question — never auto-correct
  if (!a) return false;
  if (a === k) return true;
  const dist = levenshtein(a,k);
  const threshold = k.length <= 4 ? 1 : (k.length <= 9 ? 2 : 3);
  return dist <= threshold;
}

// Generic ranking: entries = [{teamId, sortKey:[...] (ascending = better), raw:{display}}]
function assignRanksAndPoints(eventId, entries){
  entries.sort((a,b) => {
    for (let i=0;i<Math.max(a.sortKey.length,b.sortKey.length);i++){
      const av=a.sortKey[i], bv=b.sortKey[i];
      if (av===bv) continue;
      return av-bv;
    }
    return 0;
  });
  const result = {};
  entries.forEach((e,i) => { result[e.teamId] = { rank:i+1, points: pts(i+1), raw:e.raw }; });
  return result;
}

function isCancelled(eventId){ return (state.cancelledEvents||[]).includes(eventId); }

/* Returns the raw per-owner array for a team on a time/makes/sum3-type event, with a
   migration-safe fallback: legacy single-value entries (from before co-owner averaging

function ownerSubsRaw(evId, t){
  const v = (state.raw[evId] || {})[t.id];
  if (v && Array.isArray(v.subs)) return v.subs;
  if (v !== undefined && v !== null) return [v]; // legacy scalar -> owner 0
  return [];
}
function applyOverrides(eventId, results){
  const ov = (state.overrides && state.overrides[eventId]) || {};
  Object.keys(ov).forEach(tid => {
    const v = ov[tid];
    if (v === null || v === undefined || v === "") return;
    const prev = results[tid];
    results[tid] = { points: Number(v), display: prev ? prev.display : "(override)", badge: prev ? prev.badge : null, overridden: true };
  });

}
function computeEventResults(eventId){

function computeEventResultsRaw(ev){

    const entries = [];
    state.teams.forEach(t => {
      const placement = raw[t.id];
      if (typeof placement === "number") entries.push({ teamId:t.id, sortKey:[placement], raw:{ display:"#"+placement } });
    });
    return rankBasedResult(entries);
  }
  if (ev.type === "time") {
    const entries = [];
    state.teams.forEach(t => {
      let secs = null, subDisplay = null;
      if ((t.coOwnerCount||1) > 1) {
        const subs = ownerSubsRaw(ev.id, t);
        const vals = subs.filter(x => typeof x === "number");
        if (vals.length) { secs = vals.reduce((a,b)=>a+b,0)/vals.length; subDisplay = subs.map(x => typeof x==="number" ? formatSeconds(x) : "—"); }
      } else if (typeof raw[t.id] === "number") secs = raw[t.id];
      if (secs != null) {
        entries.push({ teamId:t.id, sortKey:[secs, t.name], raw:{ display: formatSeconds(secs), detail: subDisplay ? subDisplay.join(" / ") : null } });
      }

    return rankBasedResult(entries);
  }
  if (ev.type === "sum3") {
    const entries = [];
    state.teams.forEach(t => {
      let sum = null, subDisplay = null;
      if ((t.coOwnerCount||1) > 1) {
        const subs = ownerSubsRaw(ev.id, t);
        const personTotals = subs.map(p => {
          if (!p || typeof p !== "object") return null;
          const any = p.a!=null || p.b!=null || p.c!=null;
          return any ? (p.a||0)+(p.b||0)+(p.c||0) : null;
        });
        const vals = personTotals.filter(x => typeof x === "number");
        if (vals.length) { sum = vals.reduce((a,b)=>a+b,0)/vals.length; subDisplay = personTotals.map(x => typeof x==="number" ? x : "—"); }
      } else {
        const v = raw[t.id];
        if (v && (typeof v.a === "number" || typeof v.b === "number" || typeof v.c === "number")) sum = (v.a||0)+(v.b||0)+(v.c||0);
      }
      if (sum != null) {
        entries.push({ teamId:t.id, sortKey:[-sum, t.name], raw:{ display: sum + " yds", detail: subDisplay ? subDisplay.join(" / ") : null, sum } });

  }

    const unit = ev.unitLabel || "made";
    const entries = [];
    state.teams.forEach(t => {
      let val = null, subDisplay = null;
      if ((t.coOwnerCount||1) > 1) {
        const subs = ownerSubsRaw(ev.id, t);
        const vals = subs.filter(x => typeof x === "number");
        if (vals.length) { val = vals.reduce((a,b)=>a+b,0)/vals.length; subDisplay = subs.map(x => typeof x==="number" ? x : "—"); }
      } else if (typeof raw[t.id] === "number") val = raw[t.id];
      if (val != null) {
        const valStr = Number.isInteger(val) ? String(val) : val.toFixed(1);
        entries.push({ teamId:t.id, sortKey:[-val, t.name], raw:{ display: valStr + " " + unit, detail: subDisplay ? subDisplay.join(" / ") : null } });
      }
    });

  }

    const entries = [];
    state.teams.forEach(t => {
      const v = raw[t.id];
      if (!v || !v.subs || !v.subs.length) return;
      const subs = v.subs;
      const anyEntered = subs.some(arr => arr.some(x => typeof x === "number"));
      if (!anyEntered) return;
      const subTotals = subs.map(arr => arr.reduce((s,x)=> s + (typeof x==="number"?x:0), 0));
      const total = subTotals.reduce((a,b)=>a+b,0) / subs.length;
      const holeInOnes = subs.reduce((cnt,arr) => cnt + arr.filter(x => x===1).length, 0);

        raw:{ display: String(total), detail: subTotals.length>1 ? subTotals.join(" / ") : null, total, holeInOnes, subTotals } });
    });

  if (ev.type === "team4") return computeTeam4Results(ev);
  if (ev.type === "quiz") return computeQuizResults();

}
function rankBasedResult(entries){
  const ranked = assignRanksAndPoints(null, entries);
  const out = {};
  Object.keys(ranked).forEach(tid => {
    out[tid] = { points: ranked[tid].points, display: ranked[tid].raw.display, detail: ranked[tid].raw.detail || null, raw: ranked[tid].raw, rank: ranked[tid].rank, badge: ranked[tid].rank<=3 ? ["🥇","🥈","🥉"][ranked[tid].rank-1] : null };
  });
  return out;
}
function computeTeam2Results(ev){
  const ta = state.teamAssignments[ev.id];
  const mr = state.matchResults[ev.id];
  const out = {};
  if (!ta || !ta.generated) return out;
  const winner = mr && mr.winner;
  ["1","2"].forEach(slot => {
    const members = ta.teams[slot] || [];
    members.forEach(tid => {
      if (!winner) { out[tid] = { points:null, display:"pending", badge:null }; return; }
      const won = winner === slot;
      out[tid] = { points: won ? ev.winPoints : 0, display: won ? "W" : "L", badge: null };
    });
  });
  return out;
}
/* Tournament-bracket scoring: Semifinal A = Team1 v Team2, Semifinal B = Team3 v Team4,
   then the two semi winners play a Final (for 1st/2nd) and the two semi losers play a
   Consolation game (for 3rd/4th). Placement points come from ev.placementPoints[0..3]. */
function computeTeam4Results(ev){
  const ta = state.teamAssignments[ev.id];
  const mr = state.matchResults[ev.id] || {};
  const out = {};
  if (!ta || !ta.generated) return out;
  const slots = ["1","2","3","4"];
  const placementPts = ev.placementPoints || [0,0,0,0];
  const ordLabel = ["1st","2nd","3rd","4th"];
  const placementOf = {};
  if (mr.semiA && mr.semiB) {
    const semiALoser = mr.semiA === "1" ? "2" : "1";
    const semiBLoser = mr.semiB === "3" ? "4" : "3";
    if (mr.final) {
      placementOf[mr.final] = 1;
      placementOf[mr.final === mr.semiA ? mr.semiB : mr.semiA] = 2;
    }
    if (mr.consolation) {
      placementOf[mr.consolation] = 3;
      placementOf[mr.consolation === semiALoser ? semiBLoser : semiALoser] = 4;
    }
  }
  slots.forEach(slot => {
    const members = ta.teams[slot] || [];
    const placement = placementOf[slot];
    members.forEach(tid => {
      if (!placement) { out[tid] = { points:null, display:"pending", badge:null }; return; }
      out[tid] = { points: placementPts[placement-1], display: ordLabel[placement-1], badge: placement<=3 ? ["🥇","🥈","🥉"][placement-1] : null };
    });
  });
  return out;
}
function computeQuizResults(){
  const q = state.quiz;
  const out = {};
  if (!q.scoresReleased) return out;
  const key = q.questions.map(x => x.a||"");
  const entries = [];
  state.teams.forEach(t => {
    const sub = q.submissions[t.id];
    if (!sub) { out[t.id] = { points:null, display:"no submission", badge:null }; return; }
    const correct = sub.answers.reduce((c,ans,i) => c + (answersMatch(ans, key[i]) ? 1 : 0), 0);
    const bonusDiff = (typeof sub.bonus === "number" && typeof q.bonusA === "number") ? Math.abs(sub.bonus - q.bonusA) : Infinity;
    entries.push({ teamId:t.id, sortKey:[-correct, bonusDiff, t.name], raw:{ display: correct + "/" + q.questions.length, correct } });
  });
  const ranked = assignRanksAndPoints(null, entries);
  Object.keys(ranked).forEach(tid => {
    out[tid] = { points: ranked[tid].points, display: ranked[tid].raw.display, rank: ranked[tid].rank, badge: ranked[tid].rank<=3 ? ["🥇","🥈","🥉"][ranked[tid].rank-1] : null };
  });
  return out;
}
/* Per-question correctness stats, once scores are released — used to show "toughest questions". */
function computeQuizQuestionStats(){
  const q = state.quiz;
  return q.questions.map((qq,i) => {
    let correct = 0, total = 0;
    state.teams.forEach(t => {
      const sub = q.submissions[t.id];
      if (!sub) return;
      total++;
      if (answersMatch(sub.answers[i], qq.a)) correct++;
    });
    return { idx:i, q: qq.q, a: qq.a, correct, total, pct: total ? correct/total : null };

function allEventResults(){
  const res = {};
  EVENTS.forEach(ev => { res[ev.id] = computeEventResults(ev.id); });
  return res;
}
function totalsFromResults(res){
  const totals = {};
  state.teams.forEach(t => { totals[t.id] = 0; });
  EVENTS.forEach(ev => {
    const r = res[ev.id] || {};
    state.teams.forEach(t => { const v = r[t.id]; if (v && typeof v.points === "number") totals[t.id] += v.points; });
  });
  return totals;
}
function standingsThroughEvent(eventId){
  // cumulative totals using only events up to and including eventId's index
  const idx = eventId ? eventIndex(eventId) : EVENTS.length-1;
  const res = allEventResults();
  const totals = {};
  state.teams.forEach(t => { totals[t.id] = 0; });
  EVENTS.forEach((ev,i) => {
    if (i>idx) return;
    const r = res[ev.id] || {};
    state.teams.forEach(t => { const v = r[t.id]; if (v && typeof v.points === "number") totals[t.id] += v.points; });
  });
  return state.teams.map(t => ({ id:t.id, name:t.name, total: totals[t.id] })).sort((a,b)=> b.total-a.total || a.name.localeCompare(b.name));
}

/* ============================== TEAM GENERATION ============================== */
function generateTeams(eventId){
  const ev = eventById(eventId);
  const std = standingsThroughEvent(ev.throughEventId);
  const teams = {};
  if (ev.teamCount === 2) {
    teams["1"]=[]; teams["2"]=[];
    std.forEach((s,i) => { (i%2===0?teams["1"]:teams["2"]).push(s.id); });
  } else if (ev.teamCount === 4) {
    teams["1"]=[]; teams["2"]=[]; teams["3"]=[]; teams["4"]=[];
    std.forEach((s,i) => { teams[String((i%4)+1)].push(s.id); });
  }
  state.teamAssignments[eventId] = { generated:true, basisThroughEventId: ev.throughEventId, teams };
  if (ev.type === "team2") state.matchResults[eventId] = { winner:null };
  if (ev.type === "team4") state.matchResults[eventId] = { semiA:null, semiB:null, final:null, consolation:null };
}

/* ---------- Standings ---------- */
function renderStandings(){
  const res = allEventResults();
  const totals = totalsFromResults(res);
  const rows = state.teams.map(t => ({ ...t, total: totals[t.id] })).sort((a,b)=> b.total-a.total || a.name.localeCompare(b.name));
  const headerCells = EVENTS.map(ev => `<th class="ctr std-head" title="${escapeHtml(ev.name)}" ${isCancelled(ev.id)?'style="opacity:.45;"':''}>
      <div class="std-head-icon">${ev.icon}</div><div class="std-head-label">${escapeHtml(ev.short)}</div>
      ${isCancelled(ev.id)?'<div class="std-head-label">(out)</div>':''}
    </th>`).join("");
  const bodyRows = rows.map((t,i) => {
    const cells = EVENTS.map(ev => {
      if (isCancelled(ev.id)) return `<td class="std-cell" style="opacity:.35;">—</td>`;
      const r = (res[ev.id]||{})[t.id];
      if (!r || r.points===null || r.points===undefined) return `<td class="std-cell">—</td>`;
      return `<td class="std-cell"><div class="std-pts">${r.points}${r.badge?`<span class="std-badge">${r.badge}</span>`:""}</div><div class="std-raw">${escapeHtml(String(r.display))}${r.detail?`<span class="std-raw-detail"><br>(${escapeHtml(r.detail)})</span>`:""}</div></td>`;
    }).join("");
    return `<tr><td class="ctr">${ordinal(i+1)}</td><td class="std-team-name"><div style="display:flex; align-items:center; gap:6px;">${teamAvatarHtml(t,20)}<div style="min-width:0;"><div>${escapeHtml(t.name)}</div>${t.ownerName?`<div class="std-owner">${escapeHtml(t.ownerName)}</div>`:""}</div></div></td>${cells}<td class="num"><strong style="font-size:14px;">${t.total}</strong></td></tr>`;
  }).join("");
  return `
  <div class="card">
    <h2>Standings</h2>
    <div style="overflow-x:auto;">
    <table class="std-table"><thead><tr><th>#</th><th class="std-team-name">Team</th>${headerCells}<th class="num">Total</th></tr></thead>
    <tbody>${bodyRows}</tbody></table>
    </div>
  </div>`;
}

    const slots = Object.keys(ta.teams);
    const boxes = slots.map(slot => `
      <div class="team-roster-box"><h4>Team ${slot}</h4><ul>${ta.teams[slot].map(tid=>`<li>${escapeHtml(nameOf(tid))}</li>`).join("")}</ul></div>

/* ---------- Ball Knowledge Quiz tab ---------- */
function renderQuizTab(){
  if (isContributor()) return renderQuizAuthor();
  const q = state.quiz;
  if (!q.started) q.started = {};
  const me = myIdentity();
  const mySub = state.teams.find(t=>t.id===myIdentityId) ? q.submissions[myIdentityId] : null;
  const hasStarted = !!q.started[myIdentityId];

  if (!q.released) {
    return `<div class="card"><h2>🧠 Ball Knowledge Quiz</h2>
      <div class="locked-box"><div class="lock-icon">🔒</div>Quiz hasn't been released yet.</div>
      ${isAdmin() ? `<div style="text-align:center;"><button class="btn" id="release-quiz">Release Quiz</button></div>` : ""}
    </div>`;
  }
  if (q.scoresReleased) {
    const r = computeQuizResults()[myIdentityId];
    const stats = computeQuizQuestionStats();
    const answeredStats = stats.filter(s => s.total > 0);
    const toughest = answeredStats.slice().sort((a,b) => a.pct - b.pct).slice(0,3);
    const toughestHtml = toughest.length ? toughest.map(s => `
      <div class="muted-note" style="margin-bottom:6px;"><strong>${s.correct}/${s.total}</strong> got Q${s.idx+1} right — "${escapeHtml(s.q||'(question)')}"</div>
    `).join("") : `<p class="muted-note">Not enough submissions yet for stats.</p>`;
    const qBlocks = q.questions.map((qq,i) => {
      const rows = state.teams.map(t => {
        const sub = q.submissions[t.id];
        const ans = sub ? sub.answers[i] : null;
        const correct = sub ? answersMatch(ans, qq.a) : false;
        return `<tr><td>${escapeHtml(t.name)}</td><td>${sub ? escapeHtml(ans || "(blank)") : '<span class="muted-note">no submission</span>'}</td><td class="ctr">${sub ? (correct?"✅":"❌") : "—"}</td></tr>`;
      }).join("");
      return `<div class="quiz-q-block">
        <div style="display:flex; justify-content:space-between; align-items:baseline; gap:8px; flex-wrap:wrap;">
          <strong style="font-size:13px;">${i+1}. ${escapeHtml(qq.q || "(question)")}</strong>
          <span class="muted-note">${stats[i].correct}/${stats[i].total} got it right</span>
        </div>
        <p class="muted-note" style="margin:4px 0 8px;">Correct answer: <strong>${escapeHtml(qq.a || "—")}</strong></p>
        <table><thead><tr><th>Team</th><th>Answer</th><th class="ctr">✓</th></tr></thead><tbody>${rows}</tbody></table>
      </div>`;
    }).join("");
    return `<div class="card"><h2>🧠 Ball Knowledge Quiz — Results</h2>
      <p class="desc">Scores are in! Full points breakdown is also on the Standings tab.</p>
      ${(r && r.points!=null) ? `<div class="badge good" style="font-size:14px; padding:8px 14px;">You got ${escapeHtml(String(r.display))} correct — ${r.points} points</div>` : '<p class="muted-note">No submission on file for your team.</p>'}
      <hr class="sep">
      <h3>Toughest questions</h3>
      ${toughestHtml}
      <hr class="sep">
      <h3>All answers</h3>
      ${qBlocks}
    </div>`;
  }
  if (mySub) {
    return `<div class="card"><h2>🧠 Ball Knowledge Quiz</h2>
      <div class="blur-wrap"><div class="blurred"><p>1. Sample question text sits here until scores are released...</p><p>2. More hidden content...</p><p>3. ...</p></div>
        <div class="blur-overlay"><div style="text-align:center;"><div style="font-size:28px;">⏳</div><p class="muted-note" style="font-weight:600;">Submitted! Waiting for scores to be released…</p></div></div>
      </div>
    </div>`;
  }
  if (hasStarted) {
    if (!quizAnswerDraft) quizAnswerDraft = { answers: Array(q.questions.length).fill(""), bonus: "" };
    const qs = q.questions.map((qq,i) => `
      <div class="quiz-q-block">
        <label style="font-weight:600; font-size:13px;">${i+1}. ${escapeHtml(qq.q || "(question)")}</label>
        <input type="text" data-qidx="${i}" value="${escapeHtml(quizAnswerDraft.answers[i])}" placeholder="Your answer">
      </div>`).join("");
    return `<div class="card"><h2>🧠 Ball Knowledge Quiz</h2>
      <p class="desc">Answer all ${q.questions.length}, plus the tiebreaker. You can only submit once!</p>
      ${qs}
      <div class="quiz-q-block">
        <label style="font-weight:600; font-size:13px;">Tiebreaker: ${escapeHtml(q.bonusQ || "(bonus question)")}</label>
        <input type="text" id="bonus-input" value="${escapeHtml(String(quizAnswerDraft.bonus))}" placeholder="Your numeric guess">
      </div>
      <button class="btn" id="submit-quiz">Submit Quiz</button>
    </div>`;
  }
  return `<div class="card"><h2>🧠 Ball Knowledge Quiz</h2>
    <div class="blur-wrap"><div class="blurred"><p>1. Sample question text sits here until you take the quiz...</p><p>2. More hidden questions...</p><p>3. ...</p></div>
      <div class="blur-overlay"><button class="btn" id="start-quiz">Take Quiz</button></div>
    </div>
  </div>`;
}

/* ---------- Scoring (admin) ---------- */
const OVERRIDE_TAB_ID = "__override__";
function renderScoring(){
  const chips = EVENTS.map(ev => `<button class="event-chip ${activeScoringEvent===ev.id?'active':''}" data-ev="${ev.id}" style="${isCancelled(ev.id)?'text-decoration:line-through; opacity:.6;':''}">${ev.icon} ${escapeHtml(ev.name)}</button>`).join("")
    + `<button class="event-chip ${activeScoringEvent===OVERRIDE_TAB_ID?'active':''}" data-ev="${OVERRIDE_TAB_ID}">🛠️ Override</button>`;
  if (activeScoringEvent === OVERRIDE_TAB_ID) {
    return `<div class="card"><h2>Scoring</h2><p class="desc">Admin-only. Enter results below — the standings update immediately.</p>
      <div class="event-tab-list">${chips}</div>${renderScoringOverride()}</div>`;
  }
  const ev = eventById(activeScoringEvent);
  const cancelled = isCancelled(ev.id);
  const canResetThis = ev.id === "quiz" ? isRatPack() : true;
  const controls = `
    <div style="display:flex; gap:8px; margin-bottom:14px;">
      ${cancelled
        ? `<button class="btn secondary small" id="restore-event">Restore Event</button>`
        : `${canResetThis ? `<button class="btn secondary small" id="reset-event">Reset Scores</button>` : ""}
           <button class="btn danger small" id="cancel-event">Cancel Event</button>`}
    </div>`;
  let body = "";
  if (cancelled) {
    body = `<div class="empty-state">This event has been cancelled and is excluded from standings. Restore it to resume scoring.</div>`;
  } else if (ev.type==="rank") body = renderScoringRank(ev);
  else if (ev.type==="time") body = renderScoringTime(ev);
  else if (ev.type==="sum3") body = renderScoringSum3(ev);
  else if (ev.type==="makes") body = renderScoringMakes(ev);
  else if (ev.type==="golf18") body = renderScoringGolf(ev);
  else if (ev.type==="team2") body = renderScoringTeam2(ev);
  else if (ev.type==="team4") body = renderScoringTeam4(ev);
  else if (ev.type==="quiz") body = renderScoringQuiz(ev);
  return `<div class="card"><h2>Scoring</h2><p class="desc">Admin-only. Enter results below — the standings update immediately.</p>
    <div class="event-tab-list">${chips}</div>${controls}${body}</div>`;
}
function renderScoringOverride(){
  const res = allEventResults();
  const headerCells = EVENTS.map(ev => `<th class="ctr">${ev.icon}<br>${escapeHtml(ev.short)}</th>`).join("");
  const rows = state.teams.map(t => {
    const cells = EVENTS.map(ev => {
      const ov = (state.overrides[ev.id]||{})[t.id];
      const r = (res[ev.id]||{})[t.id];
      const curPts = (r && r.points!=null) ? r.points : "—";
      return `<td class="ctr"><input type="number" style="width:56px;" data-ovr-ev="${ev.id}" data-ovr-team="${t.id}" value="${ov!=null ? ov : ''}" placeholder="${curPts}"></td>`;
    }).join("");
    return `<tr><td>${escapeHtml(t.name)}</td>${cells}</tr>`;
  }).join("");
  return `<div class="card" style="margin-bottom:0;">
    <h3 style="margin-bottom:4px;">🛠️ Manual Override</h3>
    <p class="desc" style="margin-bottom:8px;">Fail-safe: type a point value here to force any team's score for any event — it overrides whatever the computed result would be, and standings update immediately. Clear the box to go back to the computed value (shown greyed-out as a placeholder).</p>
    <div style="overflow-x:auto;"><table><thead><tr><th>Team</th>${headerCells}</tr></thead><tbody>${rows}</tbody></table></div>
  </div>`;
}
function resetEventData(eventId){
  const ev = eventById(eventId);
  delete state.raw[eventId];
  if (ev.type==="team2") { if (state.matchResults[eventId]) state.matchResults[eventId] = { winner:null }; }
  if (ev.type==="team4") { if (state.matchResults[eventId]) state.matchResults[eventId] = { semiA:null, semiB:null, final:null, consolation:null }; }
  if (ev.type==="quiz") {
    state.quiz.released = false;
    state.quiz.scoresReleased = false;
    state.quiz.submissions = {};
    state.quiz.started = {};
  }
}
function scoringTableShell(ev, rows, extraHeaders){

}

function renderScoringGolf(ev){

    const subCount = t.coOwnerCount || 1;

    const subBlocks = v.subs.map((holes, si) => `
      <div style="margin-bottom:6px;">
        ${subCount>1 ? `<div class="muted-note">${escapeHtml((t.coOwnerNames && t.coOwnerNames[si]) || ("Member "+(si+1)))}</div>` : ""}
        <div class="golf-holes-row">
          ${holes.map((h,hi) => `<div class="golf-hole-cell"><label>${hi+1}</label><input class="hole-input" type="number" min="1" data-team="${t.id}" data-sub="${si}" data-hole="${hi}" value="${h ?? ''}"></div>`).join("")}
        </div>
      </div>`).join("");
    const r = res[t.id];
    return `<div class="golf-team-card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3>${escapeHtml(t.name)}</h3>
        <div>${r ? `Total: <strong>${r.raw ? r.raw.total : ''}</strong> · Points: <strong>${r.points}</strong>` : '<span class="muted-note">no data yet</span>'}</div>
      </div>
      ${subBlocks}
    </div>`;
  }).join("");
  return cards;
}
function teamRosterLabel(ev, slot){ const ta = state.teamAssignments[ev.id]; return ta && ta.teams[slot] ? ta.teams[slot].map(nameOf).join(", ") : ""; }

function renderScoringTeam4(ev){
  const ta = state.teamAssignments[ev.id];
  if (!ta || !ta.generated) return `<p class="muted-note">Generate teams on the Team Assignments tab first.</p>`;
  const mr = state.matchResults[ev.id] || {};
  const matchupRow = (key, sideA, sideB) => {

    return `<div class="matchup-row">
      <div class="side ${w===sideA?'winner':''}"><strong>Team ${sideA}</strong><br><span class="muted-note">${escapeHtml(teamRosterLabel(ev,sideA))}</span></div>

    </div>`;
  };
  const waitingRow = msg => `<div class="matchup-row" style="opacity:.5;"><span class="muted-note">${escapeHtml(msg)}</span></div>`;
  const semiAWinner = mr.semiA, semiBWinner = mr.semiB;
  const bothSemisDone = !!(semiAWinner && semiBWinner);
  const semiALoser = semiAWinner ? (semiAWinner==="1"?"2":"1") : null;
  const semiBLoser = semiBWinner ? (semiBWinner==="3"?"4":"3") : null;

  let html = `<h3 style="margin:16px 0 6px; font-size:13px;">🥊 Semifinal A — Team 1 vs Team 2</h3>` + matchupRow("semiA","1","2");
  html += `<h3 style="margin:16px 0 6px; font-size:13px;">🥊 Semifinal B — Team 3 vs Team 4</h3>` + matchupRow("semiB","3","4");
  html += `<h3 style="margin:16px 0 6px; font-size:13px;">🏆 Final — winners play for 1st &amp; 2nd (6 / 4 pts)</h3>`
    + (bothSemisDone ? matchupRow("final", semiAWinner, semiBWinner) : waitingRow("Waiting on both semifinals to finish…"));
  html += `<h3 style="margin:16px 0 6px; font-size:13px;">🥉 Consolation — losers play for 3rd &amp; 4th (2 / 0 pts)</h3>`
    + (bothSemisDone ? matchupRow("consolation", semiALoser, semiBLoser) : waitingRow("Waiting on both semifinals to finish…"));
  return renderRosterEditor(ev) + html;
}
function renderScoringQuiz(ev){
  const q = state.quiz;

}

function bindShell(){
  document.getElementById("btn-settings").onclick = openSettings;
  document.querySelectorAll("nav.tabs button").forEach(b => { b.onclick = () => { activeTab = b.dataset.tab; render(); }; });

  if (activeTab === "quiz") bindQuizTab();
  if (activeTab === "teams") bindTeamsTab();
  if (activeTab === "scoring" && isAdmin()) bindScoringTab();
}

function bindQuizTab(){
  const q = state.quiz;
  if (isContributor()) {
    const save = document.getElementById("save-quiz");
    if (save) save.onclick = () => {
      document.querySelectorAll("[data-qq]").forEach(inp => { q.questions[inp.dataset.qq].q = inp.value; });

      q.bonusQ = document.getElementById("bonus-q").value;
      const ba = document.getElementById("bonus-a").value;
      q.bonusA = ba === "" ? null : Number(ba);
      saveState(); toast("Quiz saved.");
    };
    return;
  }

  if (rel) rel.onclick = () => { q.released = true; saveState(); toast("Quiz released!"); };

  if (start) start.onclick = () => {
    confirmModal("Start the quiz?", "Once you start, this can't be undone from your side — only an admin can reset it. Make sure whoever's verifying is watching now.", () => {
      if (!q.started) q.started = {};
      q.started[myIdentityId] = Date.now();
      quizAnswerDraft = { answers: Array(q.questions.length).fill(""), bonus:"" };
      saveState(); toast("Quiz started!");
    });
  };
  document.querySelectorAll("[data-qidx]").forEach(inp => { inp.oninput = () => { quizAnswerDraft.answers[inp.dataset.qidx] = inp.value; }; });

      q.submissions[myIdentityId] = { answers: quizAnswerDraft.answers.slice(), bonus: Number(quizAnswerDraft.bonus), submittedAt: Date.now() };

    });

}
function bindTeamsTab(){
  document.querySelectorAll("[data-gen]").forEach(btn => {
    btn.onclick = () => {
      const evId = btn.dataset.gen;
      confirmModal("Generate teams?", "This locks in team assignments for \"" + eventById(evId).name + "\" based on current standings. This can't be undone from here.", () => {
        generateTeams(evId); saveState(); toast("Teams generated!");
      });

function focusNextGolfInput(team, subIdx, holeIdx){
  const t = teamById(team);
  const subCount = (t && t.coOwnerCount) || 1;
  let nextTeam = team, nextSub = subIdx, nextHole = holeIdx + 1;
  if (nextHole >= 18) {
    nextHole = 0; nextSub = subIdx + 1;
    if (nextSub >= subCount) {
      nextSub = 0;
      const idx = state.teams.findIndex(tm => tm.id === team);
      const nt = state.teams[idx + 1];
      if (!nt) return;
      nextTeam = nt.id;
    }
  }
  const el = document.querySelector(`[data-team="${nextTeam}"][data-sub="${nextSub}"][data-hole="${nextHole}"]`);
  if (el) { el.focus(); el.select && el.select(); }
}
function focusNextTeamInput(currentTeamId){
  const idx = state.teams.findIndex(t => t.id === currentTeamId);
  const nextTeam = state.teams[idx + 1];
  if (!nextTeam) return;
  let el = document.querySelector(`[data-raw="${nextTeam.id}"][data-owner="0"]:not([data-sub])`);
  if (!el) el = document.querySelector(`[data-raw="${nextTeam.id}"]:not([data-sub]):not([data-owner])`);
  if (el) { el.focus(); el.select && el.select(); }
}
function focusNextOwnerInput(currentTeamId, ownerIdx){
  const t = teamById(currentTeamId);
  const subCount = (t && t.coOwnerCount) || 1;
  if (ownerIdx + 1 < subCount) {
    const el = document.querySelector(`[data-raw="${currentTeamId}"][data-owner="${ownerIdx+1}"]`);
    if (el) { el.focus(); el.select && el.select(); return; }
  }
  focusNextTeamInput(currentTeamId);
}
function focusNextSum3Input(currentTeamId, currentSub, ownerIdx){
  const order = ["a","b","c"];
  const curIdx = order.indexOf(currentSub);
  const selFor = (o,s) => o!==undefined ? `[data-raw="${currentTeamId}"][data-owner="${o}"][data-sub="${s}"]` : `[data-raw="${currentTeamId}"]:not([data-owner])[data-sub="${s}"]`;
  if (curIdx < order.length - 1) {
    const el = document.querySelector(selFor(ownerIdx, order[curIdx+1]));
    if (el) { el.focus(); el.select && el.select(); return; }
  }
  if (ownerIdx !== undefined) {
    const t = teamById(currentTeamId);
    const subCount = (t && t.coOwnerCount) || 1;
    if (ownerIdx + 1 < subCount) {
      const el = document.querySelector(selFor(ownerIdx+1, "a"));
      if (el) { el.focus(); el.select && el.select(); return; }
    }
  }
  const idx = state.teams.findIndex(t => t.id === currentTeamId);
  const nextTeam = state.teams[idx + 1];
  if (!nextTeam) return;
  let el = document.querySelector(`[data-raw="${nextTeam.id}"][data-owner="0"][data-sub="a"]`);
  if (!el) el = document.querySelector(`[data-raw="${nextTeam.id}"]:not([data-owner])[data-sub="a"]`);
  if (el) { el.focus(); el.select && el.select(); }
}
function bindOverrideInputs(){
  document.querySelectorAll("[data-ovr-ev]").forEach(inp => {
    inp.onchange = () => {
      const evId = inp.dataset.ovrEv, tid = inp.dataset.ovrTeam;
      if (!state.overrides) state.overrides = {};
      if (!state.overrides[evId]) state.overrides[evId] = {};
      if (inp.value === "") delete state.overrides[evId][tid];
      else state.overrides[evId][tid] = Number(inp.value);
      saveState();
    };
  });
}
function bindScoringTab(){
  document.querySelectorAll(".event-chip[data-ev]").forEach(c => { c.onclick = () => { activeScoringEvent = c.dataset.ev; render(); }; });
  if (activeScoringEvent === OVERRIDE_TAB_ID) { bindOverrideInputs(); return; }
  const ev = eventById(activeScoringEvent);

  const resetBtn = document.getElementById("reset-event");
  if (resetBtn) resetBtn.onclick = () => confirmModal("Reset scores?", "This clears all entered scores/results for \"" + ev.name + "\" so you can re-enter them. Team assignments (if any) are kept.", () => {
    resetEventData(ev.id); saveState(); toast("Scores reset for " + ev.name + ".");
  });
  const cancelBtn = document.getElementById("cancel-event");
  if (cancelBtn) cancelBtn.onclick = () => confirmModal("Cancel this event?", "\"" + ev.name + "\" will be removed from standings (greyed out, no points) until you restore it.", () => {
    if (!state.cancelledEvents) state.cancelledEvents = [];
    state.cancelledEvents.push(ev.id); saveState(); toast(ev.name + " cancelled.");
  });
  const restoreBtn = document.getElementById("restore-event");
  if (restoreBtn) restoreBtn.onclick = () => {
    state.cancelledEvents = (state.cancelledEvents||[]).filter(id => id !== ev.id);
    saveState(); toast(ev.name + " restored.");
  };

  if (ev.type==="rank" || ev.type==="time" || ev.type==="makes") {
    document.querySelectorAll("[data-raw]").forEach(inp => {
      inp.onchange = () => {
        if (!state.raw[ev.id]) state.raw[ev.id] = {};
        const tid = inp.dataset.raw;
        const ownerIdx = inp.dataset.owner;
        let v = inp.value, parsed;
        if (ev.type==="time") parsed = parseTimeToSeconds(v);
        else parsed = v===""?null:Number(v);
        if (ownerIdx !== undefined) {
          if (!state.raw[ev.id][tid] || !Array.isArray(state.raw[ev.id][tid].subs)) {
            const t = teamById(tid);
            state.raw[ev.id][tid] = { subs: Array(t.coOwnerCount||1).fill(null) };
          }
          state.raw[ev.id][tid].subs[Number(ownerIdx)] = parsed;
        } else {
          state.raw[ev.id][tid] = parsed;
        }
        saveState();
      };
      inp.onkeydown = (e) => {
        if (e.key !== "Enter") return;
        e.preventDefault();
        const tid = inp.dataset.raw;
        const ownerIdx = inp.dataset.owner;
        inp.blur();
        if (ownerIdx !== undefined) focusNextOwnerInput(tid, Number(ownerIdx));
        else focusNextTeamInput(tid);
      };
    });
  }
  if (ev.type==="sum3") {
    document.querySelectorAll("[data-raw][data-sub]").forEach(inp => {
      inp.onchange = () => {
        if (!state.raw[ev.id]) state.raw[ev.id] = {};
        const tid = inp.dataset.raw;
        const sub = inp.dataset.sub;
        const ownerIdx = inp.dataset.owner;
        const val = inp.value===""?null:Number(inp.value);
        if (ownerIdx !== undefined) {
          if (!state.raw[ev.id][tid] || !Array.isArray(state.raw[ev.id][tid].subs)) {
            const t = teamById(tid);
            state.raw[ev.id][tid] = { subs: Array.from({length:t.coOwnerCount||1}, ()=>({})) };
          }
          if (!state.raw[ev.id][tid].subs[Number(ownerIdx)]) state.raw[ev.id][tid].subs[Number(ownerIdx)] = {};
          state.raw[ev.id][tid].subs[Number(ownerIdx)][sub] = val;
        } else {
          if (!state.raw[ev.id][tid]) state.raw[ev.id][tid] = {};
          state.raw[ev.id][tid][sub] = val;
        }
        saveState();
      };
      inp.onkeydown = (e) => {
        if (e.key !== "Enter") return;
        e.preventDefault();
        const tid = inp.dataset.raw;
        const sub = inp.dataset.sub;
        const ownerIdx = inp.dataset.owner;
        inp.blur();
        focusNextSum3Input(tid, sub, ownerIdx!==undefined ? Number(ownerIdx) : undefined);
      };
    });
  }
  if (ev.type==="golf18") {
    document.querySelectorAll("[data-team][data-sub][data-hole]").forEach(inp => {
      inp.onchange = () => {
        if (!state.raw[ev.id]) state.raw[ev.id] = {};
        const tid = inp.dataset.team;
        const t = teamById(tid);
        const subCount = t.coOwnerCount||1;
        if (!state.raw[ev.id][tid]) state.raw[ev.id][tid] = { subs: Array.from({length:subCount}, ()=>Array(18).fill(null)) };
        state.raw[ev.id][tid].subs[Number(inp.dataset.sub)][Number(inp.dataset.hole)] = inp.value===""?null:Number(inp.value);
        saveState();
      };
      inp.onkeydown = (e) => {
        if (e.key !== "Enter") return;
        e.preventDefault();
        const team = inp.dataset.team;
        const subIdx = Number(inp.dataset.sub);
        const holeIdx = Number(inp.dataset.hole);
        inp.blur();
        focusNextGolfInput(team, subIdx, holeIdx);
      };
    });
  }
  document.querySelectorAll("[data-winner2]").forEach(btn => {
    btn.onclick = () => { state.matchResults[ev.id] = { winner: btn.dataset.winner2 }; saveState(); };
  });
  document.querySelectorAll("[data-bracket]").forEach(btn => {
    btn.onclick = () => {
      const key = btn.dataset.bracket;
      state.matchResults[ev.id][key] = btn.dataset.side;
      if (key === "semiA" || key === "semiB") { state.matchResults[ev.id].final = null; state.matchResults[ev.id].consolation = null; }
      saveState();
    };
  });
  document.querySelectorAll("[data-roster-move]").forEach(sel => {
    sel.onchange = () => {
      const evId = sel.dataset.rosterMove;
      const tid = sel.dataset.member;
      const newSlot = sel.value;
      const rosterTa = state.teamAssignments[evId];
      if (!rosterTa) return;
      Object.keys(rosterTa.teams).forEach(s => { rosterTa.teams[s] = rosterTa.teams[s].filter(id => id !== tid); });
      if (!rosterTa.teams[newSlot]) rosterTa.teams[newSlot] = [];
      rosterTa.teams[newSlot].push(tid);
      saveState(); toast(nameOf(tid) + " moved to Team " + newSlot + ".");
    };
  });
  const releaseScores = document.getElementById("release-scores");
  if (releaseScores) releaseScores.onclick = () => confirmModal("Release quiz scores?", "This grades all submissions against the answer key and posts points to standings.", () => {
    state.quiz.scoresReleased = true; saveState(); toast("Scores released!");
  });
}

function confirmModal(title, body, onConfirm){

    <div class="row"><button class="btn secondary" id="m-cancel">Cancel</button><button class="btn" id="m-ok">Confirm</button></div></div></div>`);

        else t.role = sel.value;
      });
      if (newOwnerId) state.teams.forEach(t => { if (t.id!==newOwnerId && t.role==="owner") t.role="admin"; });
      saveState(); toast("Roles updated.");
      backdrop.remove();
    };
    backdrop.querySelectorAll("[data-resetpin]").forEach(btn => {
      btn.onclick = () => { delete state.pinHashes[btn.dataset.resetpin]; saveState(); toast("PIN reset — they'll be asked to set a new one next login."); };
    });
  }
}

/* ============================== INIT ============================== */
async function init(){
  render(); // shows cached state instantly if we have it, else a loading screen
  try {
    const remote = await apiGetState();
    if (remote && (!state || (remote.meta && remote.meta.updatedAt >= (state.meta?state.meta.updatedAt:0)))) {
      state = migrateState(remote); LS.set("mgc_state", state);
    }
    setSyncOk(true);
  } catch(e) {
    setSyncOk(false);
    if (!state) { const note = document.getElementById("loading-note"); if (note) note.textContent = "Can't reach the server right now — retrying…"; }
  }
  render();
  startPolling();
}
init();

})();
</script>
